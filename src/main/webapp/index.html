
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Complaint Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        header {
            background: #173b70;
            color: white;
            padding: 22px 8%;
        }

        main {
            max-width: 850px;
            margin: 80px auto;
            padding: 25px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 45px 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #173b70;
        }

        p {
            line-height: 1.7;
            color: #526071;
        }

        .btn {
            display: inline-block;
            margin: 12px 6px;
            padding: 12px 24px;
            border-radius: 7px;
            text-decoration: none;
            background: #173b70;
            color: white;
        }

        .secondary {
            background: #e5edf8;
            color: #173b70;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <header>
        <strong>Campus Complaint Management System</strong>
    </header>

    <main>
        <div class="card">
            <h1>Welcome to CampusCare</h1>

            <p>
                Submit campus complaints, track their status,
                and stay informed about their resolution.
            </p>

            <a class="btn" href="login.jsp">Login</a>
            <a class="btn secondary" href="register.jsp">Register</a>
        </div>
    </main>
</body>
</html>
